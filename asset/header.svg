<svg fill="none" viewBox="0 0 1200 280" width="1200" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#D97757" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97757" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow-left" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-right" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#D97757" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>

    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 3px;
        fill: #F8FAFC;
      }
      .role {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 1.5px;
        fill: #94A3B8;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        fill: #E2E8F0;
      }
      .pulse-dot {
        animation: pulse 2.2s ease-in-out infinite;
        transform-origin: center;
      }
      .wave-1 {
        animation: drift1 9s ease-in-out infinite alternate;
      }
      .wave-2 {
        animation: drift2 12s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes drift1 {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-35px); }
      }
      @keyframes drift2 {
        0% { transform: translateX(0px); }
        100% { transform: translateX(35px); }
      }
    </style>
  </defs>

  
  <rect width="1200" height="280" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />
  <rect width="1200" height="280" rx="16" fill="url(#glow-left)" />
  <rect width="1200" height="280" rx="16" fill="url(#glow-right)" />
  <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="15.25" stroke="#30363D" stroke-width="1.5" />

  
  <g opacity="0.35">
    <path class="wave-1" d="M-40 220 C 180 150, 380 265, 620 205 C 860 145, 1020 250, 1260 190" stroke="#38BDF8" stroke-width="1.5" fill="none" />
    <path class="wave-2" d="M-40 240 C 210 275, 440 165, 680 225 C 900 275, 1060 175, 1260 220" stroke="#D97757" stroke-width="1.5" fill="none" />
  </g>

  
  <circle cx="960" cy="85" r="3" fill="#38BDF8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1045" cy="125" r="2.5" fill="#D97757">
    <animate attributeName="opacity" values="1;0.25;1" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1095" cy="70" r="3.5" fill="#38BDF8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite" />
  </circle>
  <line x1="960" y1="85" x2="1045" y2="125" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" />
  <line x1="1045" y1="125" x2="1095" y2="70" stroke="#D97757" stroke-opacity="0.25" stroke-width="1" />
  <line x1="960" y1="85" x2="1095" y2="70" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="1" />

  
  <rect x="64" y="54" width="295" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <circle class="pulse-dot" cx="84" cy="69" r="4.5" fill="#22C55E" />
  <text x="98" y="73" class="pill-text">FOCUS: AI SAFETY &amp; SECURITY</text>

  
  <text x="64" y="142" class="name">ANDREA FIORLETTA</text>
  <text x="64" y="178" class="role">SOFTWARE &amp; SECURITY ENGINEER  //  AI SYSTEMS &amp; MULTI-TENANT ARCHITECTURE</text>

  
  <rect x="64" y="204" width="520" height="2" fill="url(#accent-line)" />
</svg>
