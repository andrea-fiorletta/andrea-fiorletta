<svg width="900" height="270" viewBox="0 0 900 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#11161f" />
    </linearGradient>
    <radialGradient id="glowWarm" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d97757" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCool" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a371f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0" />
      <stop offset="50%" stop-color="#d97757" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d97757" stop-opacity="0" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.55" />
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="899" height="269" rx="14" />
    </clipPath>
  </defs>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(270px); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .status-dot { animation: pulse 2.2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .scanline { animation: scan 6.5s linear infinite; }
    .orbit-cw { transform-origin: 765px 152px; animation: spinSlow 28s linear infinite; }
    .orbit-ccw { transform-origin: 765px 152px; animation: spinRev 20s linear infinite; }
    .node-pulse-1 { animation: pulse 2.6s ease-in-out infinite; }
    .node-pulse-2 { animation: pulse 3.2s ease-in-out 0.8s infinite; }
    .node-pulse-3 { animation: pulse 2.9s ease-in-out 1.4s infinite; }
  </style>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="270" fill="url(#bgGrad)" />
    <rect width="900" height="270" fill="url(#dotGrid)" />
    <rect width="900" height="270" fill="url(#glowWarm)" />
    <rect width="900" height="270" fill="url(#glowCool)" />

    <rect class="scanline" x="0" y="0" width="900" height="36" fill="url(#scanGrad)" />

    
    <rect x="0" y="0" width="900" height="38" fill="#161b22" fill-opacity="0.92" />
    <line x1="0" y1="38" x2="900" y2="38" stroke="#21262d" stroke-width="1" />
    <rect x="0" y="0" width="900" height="2" fill="url(#accentLine)" />

    
    <circle cx="24" cy="19" r="5" fill="#ff5f56" opacity="0.85" />
    <circle cx="42" cy="19" r="5" fill="#ffbd2e" opacity="0.85" />
    <circle cx="60" cy="19" r="5" fill="#27c93f" opacity="0.85" />

    
    <text x="82" y="23" font-family="Consolas, Menlo, Monaco, Liberation Mono, Noto Sans Mono, monospace" font-size="12" fill="#8b949e">andrea@sec-lab:~/ai-safety-engineering</text>

    
    <rect x="646" y="9" width="234" height="20" rx="10" fill="#0d1117" stroke="#238636" stroke-opacity="0.65" stroke-width="1" />
    <circle class="status-dot" cx="662" cy="19" r="3.5" fill="#3fb950" />
    <text x="673" y="23" font-family="Consolas, Menlo, Monaco, Liberation Mono, Noto Sans Mono, monospace" font-size="10.5" font-weight="bold" fill="#7ee787">FOCUS: AI SAFETY &amp; SECURITY</text>

    
    <text x="42" y="82" font-family="Consolas, Menlo, Monaco, Liberation Mono, Noto Sans Mono, monospace" font-size="12.5" font-weight="bold" fill="#d97757">&gt; SOFTWARE &amp; SECURITY ENGINEER<tspan class="cursor" fill="#d97757"> _</tspan></text>

    <text x="42" y="132" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Noto Sans, Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#f0f6fc">Andrea Fiorletta</text>

    <text x="42" y="164" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Noto Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">Engineering isolated multi-tenant architectures, applied AI pipelines,</text>
    <text x="42" y="186" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Noto Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#9da7b3">and verifiable, hardened software systems.</text>

    
    <rect x="42" y="212" width="144" height="28" rx="14" fill="#d97757" fill-opacity="0.12" stroke="#d97757" stroke-opacity="0.5" stroke-width="1" />
    <text x="114" y="230" text-anchor="middle" font-family="Consolas, Menlo, Monaco, Liberation Mono, Noto Sans Mono, monospace" font-size="11" font-weight="bold" fill="#f0a98e">AI Safety &amp; Evals</text>

    <rect x="196" y="212" width="154" height="28" rx="14" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
    <text x="273" y="230" text-anchor="middle" font-family="Consolas, Menlo, Monaco, Liberation Mono, Noto Sans Mono, monospace" font-size="11" font-weight="bold" fill="#7dd3fc">OWASP Hardening</text>

    <rect x="360" y="212" width="132" height="28" rx="14" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.45" stroke-width="1" />
    <text x="426" y="230" text-anchor="middle" font-family="Consolas, Menlo, Monaco, Liberation Mono, Noto Sans Mono, monospace" font-size="11" font-weight="bold" fill="#d2a8ff">RAG &amp; pgvector</text>

    <rect x="502" y="212" width="126" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="565" y="230" text-anchor="middle" font-family="Consolas, Menlo, Monaco, Liberation Mono, Noto Sans Mono, monospace" font-size="11" font-weight="bold" fill="#c9d1d9">Python · Rust</text>

    
    <g>
      <circle class="orbit-cw" cx="765" cy="152" r="76" stroke="#30363d" stroke-width="1.2" stroke-dasharray="6 6" fill="none" />
      <circle class="orbit-ccw" cx="765" cy="152" r="58" stroke="#d97757" stroke-opacity="0.38" stroke-width="1.4" stroke-dasharray="28 18 10 18" fill="none" />
      <circle cx="765" cy="152" r="44" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <path d="M765 117 L795 129 V152 C795 170 782 183 765 189 C748 183 735 170 735 152 V129 L765 117 Z" fill="#0d1117" stroke="#d97757" stroke-width="2" stroke-linejoin="round" />
      <line x1="765" y1="134" x2="751" y2="154" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.8" />
      <line x1="765" y1="134" x2="779" y2="154" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.8" />
      <line x1="751" y1="154" x2="779" y2="154" stroke="#a371f7" stroke-width="1.4" stroke-opacity="0.8" />
      <line x1="751" y1="154" x2="765" y2="171" stroke="#d97757" stroke-width="1.4" stroke-opacity="0.8" />
      <line x1="779" y1="154" x2="765" y2="171" stroke="#d97757" stroke-width="1.4" stroke-opacity="0.8" />
      <circle class="node-pulse-1" cx="765" cy="134" r="3.5" fill="#38bdf8" />
      <circle class="node-pulse-2" cx="751" cy="154" r="3.5" fill="#a371f7" />
      <circle class="node-pulse-2" cx="779" cy="154" r="3.5" fill="#a371f7" />
      <circle class="node-pulse-3" cx="765" cy="171" r="3.8" fill="#d97757" />
      <circle cx="841" cy="152" r="3" fill="#38bdf8" opacity="0.8" />
      <circle cx="689" cy="152" r="3" fill="#d97757" opacity="0.8" />
      <circle cx="765" cy="76" r="2.5" fill="#a371f7" opacity="0.7" />
      <circle cx="765" cy="228" r="2.5" fill="#3fb950" opacity="0.7" />
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="269" rx="14" stroke="#30363d" stroke-width="1" fill="none" />
</svg>
