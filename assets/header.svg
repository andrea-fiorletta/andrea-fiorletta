<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="12%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="84%" cy="68%" r="48%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="topBarGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.45" />
    </pattern>
    <clipPath id="clip">
      <rect x="0.5" y="0.5" width="899" height="279" rx="16" />
    </clipPath>
  </defs>
  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(280px); } }
    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .cur { animation: blink 1.1s step-end infinite; }
    .scan { animation: scan 7.5s linear infinite; }
    .orbit1 { transform-origin: 760px 158px; animation: spinCW 32s linear infinite; }
    .orbit2 { transform-origin: 760px 158px; animation: spinCCW 22s linear infinite; }
    .stack-top { animation: floatY 3.8s ease-in-out infinite; }
    .n1 { animation: pulse 2.5s ease-in-out infinite; }
    .n2 { animation: pulse 2.5s ease-in-out 0.8s infinite; }
    .n3 { animation: pulse 2.5s ease-in-out 1.6s infinite; }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)" />
    <rect width="900" height="280" fill="url(#grid)" />
    <rect width="900" height="280" fill="url(#glowLeft)" />
    <rect width="900" height="280" fill="url(#glowRight)" />
    <rect class="scan" x="0" y="0" width="900" height="38" fill="url(#scanGrad)" />

    
    <rect x="0" y="0" width="900" height="40" fill="#111827" fill-opacity="0.88" />
    <line x1="0" y1="40" x2="900" y2="40" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="900" height="2" fill="url(#topBarGrad)" />

    <circle cx="24" cy="20" r="5" fill="#ff5f56" opacity="0.85" />
    <circle cx="42" cy="20" r="5" fill="#ffbd2e" opacity="0.85" />
    <circle cx="60" cy="20" r="5" fill="#27c93f" opacity="0.85" />

    <text x="82" y="24" font-family="Consolas, SFMono-Regular, Menlo, Monaco, Liberation Mono, monospace" font-size="11.5" fill="#94a3b8">andrea@engineering:~/workspace/architecture</text>

    
    <rect x="650" y="10" width="230" height="20" rx="10" fill="#0b0f17" stroke="#1e293b" stroke-width="1" />
    <circle class="dot" cx="666" cy="20" r="3.5" fill="#34d399" />
    <text x="677" y="24" font-family="Consolas, SFMono-Regular, Menlo, Monaco, Liberation Mono, monospace" font-size="10" font-weight="bold" fill="#a7f3d0">SYSTEMS · FULL-STACK · SECURITY</text>

    
    <text x="42" y="84" font-family="Consolas, SFMono-Regular, Menlo, Monaco, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#38bdf8">&gt; FULL-STACK ARCHITECT &amp; SECURITY ENGINEER<tspan class="cur" fill="#38bdf8"> _</tspan></text>

    <text x="42" y="134" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc">Andrea Fiorletta</text>

    <text x="42" y="166" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#94a3b8">Designing multi-tenant SaaS architectures, hardened backend platforms,</text>
    <text x="42" y="188" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#94a3b8">reactive TypeScript interfaces, and AI-assisted engineering workflows.</text>

    
    <rect x="42" y="218" width="134" height="28" rx="14" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.42" stroke-width="1" />
    <text x="109" y="236" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, Monaco, Liberation Mono, monospace" font-size="11" font-weight="bold" fill="#fca5a5">Laravel · PHP</text>

    <rect x="186" y="218" width="154" height="28" rx="14" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.42" stroke-width="1" />
    <text x="263" y="236" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, Monaco, Liberation Mono, monospace" font-size="11" font-weight="bold" fill="#7dd3fc">Angular · TS</text>

    <rect x="350" y="218" width="130" height="28" rx="14" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1" />
    <text x="415" y="236" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, Monaco, Liberation Mono, monospace" font-size="11" font-weight="bold" fill="#c7d2fe">Python · Rust</text>

    <rect x="490" y="218" width="144" height="28" rx="14" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.42" stroke-width="1" />
    <text x="562" y="236" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, Monaco, Liberation Mono, monospace" font-size="11" font-weight="bold" fill="#6ee7b7">Security &amp; AI</text>

    
    <g>
      <circle class="orbit1" cx="760" cy="158" r="78" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 6" fill="none" />
      <circle class="orbit2" cx="760" cy="158" r="60" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="26 16 10 16" fill="none" />
      <circle cx="760" cy="158" r="46" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

      <polygon points="760,165 792,179 760,193 728,179" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="760,147 792,161 760,175 728,161" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" stroke-linejoin="round" />
      <g class="stack-top">
        <polygon points="760,127 792,141 760,155 728,141" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round" />
        <circle class="n1" cx="760" cy="141" r="3.5" fill="#38bdf8" />
      </g>

      <circle class="n1" cx="838" cy="158" r="3" fill="#38bdf8" />
      <circle class="n2" cx="682" cy="158" r="3" fill="#818cf8" />
      <circle class="n3" cx="760" cy="80" r="3" fill="#34d399" />
      <circle class="n2" cx="760" cy="236" r="2.5" fill="#ef4444" opacity="0.85" />
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="279" rx="16" stroke="#1e293b" stroke-width="1" fill="none" />
</svg>
