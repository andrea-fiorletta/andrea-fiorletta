      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .wire { stroke-dasharray: 6 6; animation: flow 1.1s linear infinite; }
    .led { animation: pulse 2.2s ease-in-out infinite; }
  </style>

  <rect x="0.5" y="0.5" width="899" height="251" rx="16" fill="url(#archBg)" stroke="#1e293b" stroke-width="1" />

